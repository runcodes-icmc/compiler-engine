[project]
name = "compiler-engine"
version = "0.1.0"
description = "The run.codes compiler engine"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.69",
    "boto3-stubs[s3]",
    "docker==7.2.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]

[tool.uv]
# This is an application, not a distributable package.
package = false

[tool.basedpyright]
pythonVersion = "3.14"
exclude = [
    "src/rcc/tests/engine/known_issues/commits/**",
    ".venv/**",
]

[tool.ruff]
target-version = "py314"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.3",
]
