[project]
name = "compiler-engine"
version = "0.1.0"
description = "The run.codes compiler engine"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.83",
    "boto3-stubs[s3]",
    "docker==7.2.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
]

[tool.uv]
# This is an application, not a distributable package.
package = false

[tool.basedpyright]
pythonVersion = "3.14"
# Pin the mode for both the CLI and the language server. Zed otherwise forces
# `standard` (a less strict level than basedpyright's own default), which made
# the editor check a different rule set than CLI.
typeCheckingMode = "recommended"
# The tests under src/rcc/tests import the public `rcc` package by its
# absolute name, exactly as an external consumer would.
# The imports are intentional, so disable the rule.
reportImplicitRelativeImport = "none"
exclude = [
    "src/rcc/tests/engine/known_issues/commits/**",
    ".venv/**",
]

[tool.ruff]
target-version = "py314"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ruff>=0.16.3",
]
