version: "3.7"

services:
  # PHP Application Itself
  app:
    image: ghcr.io/runcodes-icmc/server:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    networks:
      - runcodes-net
    environment:
      RUNCODES_S3_PUBLIC_ENDPOINT: http://localhost:8333

  # Compiler Engine
  rcc:
    build: .
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./exec:/exec
    networks:
      - runcodes-net
    environment:
      RUNCODES_COMPILER_EXEC_DIR: /exec
      RUNCODES_COMPILER_EXEC_DIR_REMOTE: ${PWD}/exec
      # Parallelism tuning: total in-flight commits = workers x concurrency
      # (default 2 x 4 = 8). The real ceiling is how many compilation
      # containers the Docker host can run at once, not the CPU count.
      # Worker processes are the expensive part (each owns its own event
      # loop and DB connection pool), so prefer raising concurrency over
      # adding processes.
      RUNCODES_COMPILER_NUM_WORKERS: 2
      RUNCODES_COMPILER_CONCURRENCY: 4
      # DB pool sizing (defaults shown): one pooled connection per
      # in-flight commit is enough. When RUNCODES_DB_POOL_MAX_SIZE is
      # unset it is derived as concurrency + 2; set it explicitly to win.
      # RUNCODES_DB_POOL_MIN_SIZE: 1
      # RUNCODES_DB_POOL_MAX_SIZE: 6
      # RUNCODES_DB_POOL_TIMEOUT: 30

  # PostgreSQL Database
  database:
    image: ghcr.io/runcodes-icmc/database:latest-development
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=secret_password
    ports:
      - "5432:5432"
    volumes:
      - runcodes-db-vol:/var/lib/postgresql/data
    networks:
      - runcodes-net

  # Caddy reverse proxy to communicate with PHP FastCGI
  caddy:
    image: ghcr.io/runcodes-icmc/server-caddy:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile # Mount Configs
    networks:
      - runcodes-net

  # Local SMTP server for intercepting e-mails
  smtp4dev:
    image: rnwood/smtp4dev
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - runcodes-net

  # Redis for cache & session management
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - runcodes-redis-vol:/data
    networks:
      - runcodes-net

  ###########
  # Seaweed #
  ###########

  seaweed:
    image: chrislusf/seaweedfs
    ports:
      - 8333:8333
    command: server -s3 -volume.max=50 -dir="/data" -master.volumeSizeLimitMB=256 -ip=seaweed -ip.bind=0.0.0.0
    volumes:
      - runcodes-seaweed-vol:/data
    networks:
      - runcodes-net

networks:
  runcodes-net:

volumes:
  runcodes-db-vol:
  runcodes-redis-vol:
  runcodes-seaweed-vol:
